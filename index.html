    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #dddddd;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .catalog-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #e0dfdf;
        }

        .viewer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .viewer:active {
            cursor: grabbing;
        }

        .page-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .arrow:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.8);
            transform: translateY(-50%) scale(1.1);
        }

        .arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .arrow-left {
            left: 20px;
        }

        .arrow-right {
            right: 20px;
        }

        .thumbnail-strip {
            height: 120px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            overflow: auto;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-container {
            display: flex;
            gap: 10px;
            height: 100%;
            align-items: center;
        }

        .thumbnail {
            height: 90px;
            width: 64px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            flex-shrink: 0;
        }

        .thumbnail:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .thumbnail.active {
            border-color: #00a8ff;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 168, 255, 0.5);
        }

        .page-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }

        .loading {
            color: #fff;
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }

        /* Touch/swipe feedback */
        .swipe-hint {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .swipe-hint.hidden {
            opacity: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .arrow {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .arrow-left {
                left: 10px;
            }

            .arrow-right {
                right: 10px;
            }

            .page-indicator {
                top: 10px;
                right: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }

            .thumbnail-strip {
                height: 100px;
                padding: 10px;
            }

            .thumbnail {
                height: 80px;
                width: 57px;
            }

            .swipe-hint {
                bottom: 110px;
                font-size: 12px;
            }
        }

        /* Custom scrollbar for thumbnail strip */
        .thumbnail-strip::-webkit-scrollbar {
            height: 6px;
        }

        .thumbnail-strip::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .thumbnail-strip::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .thumbnail-strip::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <div class="catalog-container">
        <div class="viewer" id="viewer">
            <div class="page-indicator">
                <span id="currentPage">1</span> / <span id="totalPages">15</span>
            </div>

            <button class="arrow arrow-left" id="prevBtn" onclick="previousPage()">‹</button>
            <button class="arrow arrow-right" id="nextBtn" onclick="nextPage()">›</button>

            <div id="loading" class="loading">Loading catalog...</div>
            <div id="error" class="error-message" style="display: none;">
                Unable to load catalog page. Please check that the image files are available.
            </div>
            <img id="pageImage" class="page-image" style="display: none;" alt="Catalog Page">

            <div class="swipe-hint" id="swipeHint">
                ← Swipe or use arrow keys to navigate →
            </div>
        </div>

        <div class="thumbnail-strip">
            <div class="thumbnail-container" id="thumbnailContainer">
                <!-- Thumbnails will be generated here -->
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 15;
        let touchStartX = 0;
        let touchEndX = 0;
        let isSwipeEnabled = true;

        // Initialize the catalog
        function init() {
            generateThumbnails();
            loadPage(1);
            setupSwipeHandlers();

            // Add keyboard navigation
            document.addEventListener('keydown', handleKeyPress);

            // Hide swipe hint after first interaction
            setTimeout(() => {
                document.getElementById('swipeHint').classList.add('hidden');
            }, 3000);
        }

        function generateThumbnails() {
            const container = document.getElementById('thumbnailContainer');
            for (let i = 1; i <= totalPages; i++) {
                const thumbnail = document.createElement('img');
                thumbnail.src = `Page_${String(i).padStart(3, '0')}.png`;
                thumbnail.className = 'thumbnail';
                thumbnail.alt = `Page ${i}`;
                thumbnail.onclick = () => goToPage(i);

                // Handle thumbnail load errors
                thumbnail.onerror = function () {
                    this.style.opacity = '0.5';
                    this.style.filter = 'grayscale(100%)';
                };

                container.appendChild(thumbnail);
            }
        }

        function setupSwipeHandlers() {
            const viewer = document.getElementById('viewer');

            // Touch events for mobile
            viewer.addEventListener('touchstart', handleTouchStart, { passive: true });
            viewer.addEventListener('touchend', handleTouchEnd, { passive: true });

            // Mouse events for desktop drag
            let isMouseDown = false;
            let mouseStartX = 0;

            viewer.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseStartX = e.clientX;
                viewer.style.cursor = 'grabbing';
            });

            viewer.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                e.preventDefault();
            });

            viewer.addEventListener('mouseup', (e) => {
                if (!isMouseDown) return;
                isMouseDown = false;
                viewer.style.cursor = 'grab';

                const mouseEndX = e.clientX;
                const deltaX = mouseStartX - mouseEndX;

                if (Math.abs(deltaX) > 50) { // Minimum swipe distance
                    if (deltaX > 0) {
                        nextPage();
                    } else {
                        previousPage();
                    }
                }
            });

            viewer.addEventListener('mouseleave', () => {
                isMouseDown = false;
                viewer.style.cursor = 'grab';
            });
        }

        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
            document.getElementById('swipeHint').classList.add('hidden');
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }

        function handleSwipe() {
            const swipeDistance = touchStartX - touchEndX;
            const minSwipeDistance = 50;

            if (Math.abs(swipeDistance) > minSwipeDistance) {
                if (swipeDistance > 0) {
                    // Swiped left - go to next page
                    nextPage();
                } else {
                    // Swiped right - go to previous page
                    previousPage();
                }
            }
        }

        function loadPage(pageNum) {
            const pageImage = document.getElementById('pageImage');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');

            // Show loading state
            pageImage.style.display = 'none';
            error.style.display = 'none';
            loading.style.display = 'block';

            // Update current page
            currentPage = pageNum;
            document.getElementById('currentPage').textContent = currentPage;

            // Load the image
            const newImage = new Image();
            newImage.onload = function () {
                pageImage.src = this.src;
                pageImage.style.display = 'block';
                loading.style.display = 'none';
                updateThumbnailSelection();
                updateNavigationButtons();
                scrollThumbnailToActive();
            };

            newImage.onerror = function () {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Unable to load Page ${pageNum}. Please check that Page_${String(pageNum).padStart(3, '0')}.png exists.`;
            };

            newImage.src = `Page_${String(pageNum).padStart(3, '0')}.png`;
        }

        function updateThumbnailSelection() {
            const thumbnails = document.querySelectorAll('.thumbnail');
            thumbnails.forEach((thumb, index) => {
                thumb.classList.toggle('active', index + 1 === currentPage);
            });
        }

        function scrollThumbnailToActive() {
            const activeThumb = document.querySelector('.thumbnail.active');
            if (activeThumb) {
                activeThumb.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'center'
                });
            }
        }

        function updateNavigationButtons() {
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        function goToPage(pageNum) {
            if (pageNum >= 1 && pageNum <= totalPages) {
                loadPage(pageNum);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                goToPage(currentPage + 1);
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            }
        }

        function handleKeyPress(e) {
            switch (e.key) {
                case 'ArrowLeft':
                case 'ArrowUp':
                    previousPage();
                    break;
                case 'ArrowRight':
                case 'ArrowDown':
                    nextPage();
                    break;
                case 'Home':
                    goToPage(1);
                    break;
                case 'End':
                    goToPage(totalPages);
                    break;
            }
        }

        // Initialize when page loads
        window.addEventListener('load', init);

        // Prevent context menu on right click
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Prevent image dragging
        document.addEventListener('dragstart', e => e.preventDefault());
    </script>
</body>

</html>
