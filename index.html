<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>E-Catalog - Dayang Metal</title>
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
		<meta
			name="description"
			content="Qingdao Dayang Metal is manufacturer for decorative Stainless steel sheet. With multiple production lines, advanced equipment, experienced tecnician and good quality."
		/>
		<meta
			name="keywords"
			content="Hairline SS Finish, Satin SS Finish, Bead Blasted Finish, 8k Mirror Finish, Vibration SS Sheet, 304 Brushed Sheet, Polishing SS Sheet, Etching Elevator Door Sheet, Pvd Coating Sheet , Mirror Aluminum Sheet, catalog, e-catalog, flipbook, responsive, A4 catalog, digital magazine, book effect"
		/>
		<meta name="author" content="Dayang Metal - Dayangmetal.com" />
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
				height: 100%;
				background: #111;
				font-family: sans-serif;
			}

			.catalog-wrapper {
				position: relative;
				width: 100vw;
				height: 100vh;
				overflow: hidden;
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.catalog-pages {
				display: flex;
				transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
				height: 100%;
			}

			.page {
				flex: 0 0 100%;
				max-width: 100%;
				height: 100%;
				background: #fff;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2vh;
				transform-origin: left center;
			}

			.page img {
				width: 100%;
				height: 100%;
				object-fit: contain;
				border: 1px solid #ccc;
				box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
			}

			.nav-btn {
				position: absolute;
				top: 50%;
				transform: translateY(-50%);
				width: 45px;
				height: 45px;
				background-color: rgba(255, 255, 255, 0.3);
				border: none;
				border-radius: 50%;
				color: black;
				font-size: 22px;
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				z-index: 10;
				transition: background 0.3s;
				backdrop-filter: blur(4px);
			}

			.nav-btn:hover {
				background-color: rgba(255, 255, 255, 0.6);
			}

			.nav-btn.left {
				left: 10px;
			}

			.nav-btn.right {
				right: 10px;
			}

			@media (min-width: 768px) {
				.page {
					flex: 0 0 50%;
					max-width: 50%;
				}
			}

			@media (max-width: 768px) {
				.nav-btn {
					width: 38px;
					height: 38px;
					font-size: 18px;
				}
			}
		</style>
	</head>
	<body>
		<div class="catalog-wrapper">
			<div class="catalog-pages" id="catalogPages"></div>
			<button class="nav-btn left" id="prevBtn">&#8592;</button>
			<button class="nav-btn right" id="nextBtn">&#8594;</button>
		</div>

		<script>
			const totalPages = 13;
			const catalogPages = document.getElementById("catalogPages");
			let currentGroup = 0;

			// Create pages
			for (let i = 1; i <= totalPages; i++) {
				const page = document.createElement("div");
				page.classList.add("page");
				const img = document.createElement("img");
				const pageNum = String(i).padStart(3, "0");
				img.src = `src/Page_${pageNum}.png`;
				img.alt = `Page ${i}`;
				page.appendChild(img);
				catalogPages.appendChild(page);
			}

			const getPagesPerView = () => (window.innerWidth >= 768 ? 2 : 1);

			const updatePage = () => {
				const viewCount = getPagesPerView();
				const offset = -currentGroup * 100;
				catalogPages.style.transform = `translateX(${offset}%)`;
			};

			const next = () => {
				const maxGroup = Math.ceil(totalPages / getPagesPerView()) - 1;
				if (currentGroup < maxGroup) {
					currentGroup++;
					updatePage();
				}
			};

			const prev = () => {
				if (currentGroup > 0) {
					currentGroup--;
					updatePage();
				}
			};

			document.getElementById("nextBtn").addEventListener("click", next);
			document.getElementById("prevBtn").addEventListener("click", prev);

			document.addEventListener("keydown", (e) => {
				if (e.key === "ArrowRight") next();
				if (e.key === "ArrowLeft") prev();
			});

			// Touch swipe support
			let touchStartX = null;
			document
				.querySelector(".catalog-wrapper")
				.addEventListener("touchstart", (e) => {
					touchStartX = e.changedTouches[0].clientX;
				});

			document
				.querySelector(".catalog-wrapper")
				.addEventListener("touchend", (e) => {
					if (touchStartX === null) return;
					const deltaX = e.changedTouches[0].clientX - touchStartX;
					if (Math.abs(deltaX) > 50) {
						if (deltaX < 0) next();
						else prev();
					}
					touchStartX = null;
				});

			// Recalculate on resize
			window.addEventListener("resize", () => {
				currentGroup = Math.floor(
					(currentGroup * getPagesPerView()) / getPagesPerView()
				);
				updatePage();
			});

			// Initialize
			updatePage();
		</script>
	</body>
</html>
